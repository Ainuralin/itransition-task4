services:
  - type: web
    name: bookstore-analytics
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python analyze.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
